name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sensores de estado (pm.py)
        run: bash scripts/test-pm.sh
      - name: Guard e pre-push
        run: bash scripts/test-pm-guard.sh
      - name: Consistência do skill
        run: bash scripts/lint-skill.sh
